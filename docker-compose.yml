x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@database:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
  REDIS_URL: redis://redis:6379/0
  SEARCH_BACKEND: ${SEARCH_BACKEND:-auto}
  OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
  OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-nearby-pois}
  GRAPH_BACKEND: ${GRAPH_BACKEND:-auto}
  NEO4J_URL: ${NEO4J_URL:-bolt://neo4j:7687}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nearby_graph_dev}
  EVENT_STREAM: ${EVENT_STREAM:-nearby:events:v1}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  # Số proxy TIN CẬY đứng trước API. Anchor này là TOÀN BỘ môi trường của
  # backend, nên thiếu dòng này thì TRUSTED_PROXY_HOPS trong config/*.env
  # không bao giờ tới được container: settings.trusted_proxy_hops giữ mặc
  # định 0, client_ip() trả về IP của nginx, và MỌI người dùng chia chung một
  # hạn mức RATE_LIMIT_PER_MINUTE. Dev = 1 (chỉ nginx), prod = 2 (Caddy+nginx).
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
  OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
  OSM_BBOX: ${OSM_BBOX:-10.70,106.60,10.90,106.82}
  OSM_MAX_POIS: ${OSM_MAX_POIS:-3000}
  OSRM_URL: ${OSRM_URL:-http://osrm:5000}
  # Hồ sơ đi bộ (Phase 12.7) — đồ thị + container OSRM RIÊNG. Rỗng thì
  # directions.route(profile="foot") tự rơi về không có tuyến (None), không
  # được lặng lẽ dùng nhầm đồ thị "car" — hai đồ thị KHÔNG tương thích, đường
  # ô tô có thể đi qua chỗ người đi bộ không được phép, và ngược lại.
  OSRM_FOOT_URL: ${OSRM_FOOT_URL:-http://osrm-foot:5000}
  # Hồ sơ XE MÁY — đồ thị + container RIÊNG, dựng bằng
  # scripts/build_osrm_motorbike.sh. Rỗng thì directions.py tự lùi về đồ thị ô
  # tô và đánh dấu `approximate: true` (hành vi trước Phase 12.8).
  OSRM_MOTORBIKE_URL: ${OSRM_MOTORBIKE_URL:-http://osrm-motorbike:5000}

services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nearby-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - nearby-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - nearby-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nearby_graph_dev}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      GRAPH_PW: ${NEO4J_PASSWORD:-nearby_graph_dev}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - nearby-neo4j-data:/data
    healthcheck:
      # Dùng HTTP thay cypher-shell: cypher-shell chạy trên JVM nên riêng việc
      # khởi động đã quá 5 giây trên máy đang tải, healthcheck timeout trước khi
      # nó kịp trả lời và Neo4j bị đánh dấu unhealthy VĨNH VIỄN dù chạy hoàn toàn
      # bình thường — kéo theo graph-sync không bao giờ khởi động được vì
      # depends_on: service_healthy. Endpoint HTTP trả lời trong ~86 ms.
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-environment
    depends_on:
      database:
        condition: service_healthy
    restart: "on-failure:5"

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/15
      ALLOWED_ORIGINS: http://localhost

  osm-import:
    profiles: ["data"]
    build: ./backend
    command:
      [
        "python",
        "-m",
        "scripts.import_osm_pois",
        "--bbox",
        "${OSM_BBOX:-10.70,106.60,10.90,106.82}",
        "--max-pois",
        "${OSM_MAX_POIS:-3000}",
      ]
    environment:
      <<: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  search-index:
    profiles: ["data"]
    build: ./backend
    command: ["python", "-m", "app.search.reindex", "--recreate"]
    environment:
      <<: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  graph-sync:
    profiles: ["data"]
    build: ./backend
    command: ["python", "-m", "app.graph.sync", "--recreate"]
    environment:
      <<: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy

  feature-store:
    profiles: ["data"]
    build: ./backend
    command: ["python", "-m", "app.features.materialize"]
    environment:
      <<: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      <<: *backend-environment
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  stream-worker:
    build: ./backend
    command: ["python", "-m", "app.stream_worker"]
    restart: unless-stopped
    environment:
      <<: *backend-environment
      CONSUMER_GROUP: ${CONSUMER_GROUP:-realtime-scoring}
      CONSUMER_NAME: ${CONSUMER_NAME:-worker-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${GATEWAY_PORT:-8081}
      # VITE_ chứ không chỉ NEXT_PUBLIC_: vinext (beta) không inline biến
      # NEXT_PUBLIC_* xuống bundle trình duyệt ở chế độ dev, Vite thì có —
      # xem ghi chú ở components/location-explorer.tsx. Giữ cả hai để cấu
      # hình cũ không gãy.
      #
      # Giá trị đến từ file `.env` ở gốc repo (đã .gitignore) chứ KHÔNG phải
      # config/development.env — file đó được commit, mà đây là API key.
      # Chạy: docker compose --env-file config/development.env --env-file .env ...
      VITE_MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      NEXT_PUBLIC_MAP_STYLE_URL: ${MAP_STYLE_URL:-}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # `node -e` phai khoi dong ca runtime Node truoc khi chay dong lenh:
      # rieng phan do da an gan het 4 giay tren may dang tai, nen healthcheck cu
      # bao "exceeded timeout (4s)" lien tuc du `GET /` tra 200. Do len 15s va
      # gian nhip kiem tra — container nay chi can biet la con song.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 40s


  # Chỉ đường thật (lộ trình B16). Dữ liệu dựng sẵn trong ./osrm bằng
  # scripts/build_osrm.sh — KHÔNG dựng lúc khởi động: osrm-extract mất vài phút
  # và ngốn RAM, chạy nó mỗi lần `up` sẽ làm cả stack không lên nổi trên máy
  # yếu. Thiếu file .osrm thì container này thoát và mọi thứ còn lại vẫn chạy,
  # backend tự rơi về deep-link Google Maps.
  osrm:
    image: osrm/osrm-backend:latest
    command: ["osrm-routed", "--algorithm", "mld", "--max-matching-size", "-1", "/data/hcm.osrm"]
    volumes:
      - ./osrm:/data:ro
    ports:
      - "${OSRM_PORT:-5001}:5000"
    restart: "no"
    healthcheck:
      # Image osrm/osrm-backend KHONG co wget cung KHONG co curl (`command -v
      # wget curl` tra rong), nen healthcheck cu thoat 127 moi lan va container
      # nay unhealthy vinh vien du no dinh tuyen binh thuong — den bao sai, con
      # bat ky service nao `depends_on: service_healthy` osrm thi treo mai mai.
      #
      # Dung /dev/tcp cua bash de goi HTTP ma khong can cai them goi. Phai goi
      # `bash` TUONG MINH: CMD-SHELL chay /bin/sh, ma /bin/sh trong image nay la
      # dash, va dash bao "cannot create /dev/tcp/...: Directory nonexistent".
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /route/v1/driving/106.7009,10.7757;106.7018,10.7784?overview=false HTTP/1.0\r\n\r\n' >&3 && grep -q '\"code\":\"Ok\"' <&3"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Hồ sơ ĐI BỘ (Phase 12.7) — đồ thị RIÊNG ("hcm-foot.osrm", dựng bằng
  # scripts/build_osrm_foot.sh), vì một osrm-routed chỉ phục vụ đúng một đồ thị
  # mỗi lần chạy — không thể "đổi profile lúc gọi API" trên cùng một file
  # .osrm. Container "car" ở trên và container này chạy song song, hai cổng
  # khác nhau; backend chọn container theo profile được yêu cầu.
  osrm-foot:
    image: osrm/osrm-backend:latest
    command: ["osrm-routed", "--algorithm", "mld", "--max-matching-size", "-1", "/data/hcm-foot.osrm"]
    volumes:
      - ./osrm:/data:ro
    ports:
      - "${OSRM_FOOT_PORT:-5002}:5000"
    restart: "no"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /route/v1/foot/106.7009,10.7757;106.7018,10.7784?overview=false HTTP/1.0\r\n\r\n' >&3 && grep -q '\"code\":\"Ok\"' <&3"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Hồ sơ XE MÁY (Phase 12.8) — đồ thị RIÊNG "hcm-motorbike.osrm", dựng từ
  # osrm/motorbike.lua bằng scripts/build_osrm_motorbike.sh. Cùng lý do tách
  # container như `osrm-foot`: một osrm-routed chỉ phục vụ đúng một đồ thị.
  #
  # Thiếu file .osrm thì container này thoát và phần còn lại vẫn chạy — backend
  # lùi về đồ thị ô tô kèm cờ `approximate`.
  osrm-motorbike:
    image: osrm/osrm-backend:latest
    command:
      ["osrm-routed", "--algorithm", "mld", "--max-matching-size", "-1", "/data/hcm-motorbike.osrm"]
    volumes:
      - ./osrm:/data:ro
    ports:
      - "${OSRM_MOTORBIKE_PORT:-5003}:5000"
    restart: "no"
    healthcheck:
      # Cùng cách gọi HTTP bằng /dev/tcp của bash như hai service OSRM kia —
      # ảnh này không có wget lẫn curl, và /bin/sh là dash nên phải gọi `bash`
      # tường minh.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /route/v1/driving/106.7009,10.7757;106.7018,10.7784?overview=false HTTP/1.0\r\n\r\n' >&3 && grep -q '\"code\":\"Ok\"' <&3"
      interval: 15s
      timeout: 15s
      retries: 5
      # Graph xe máy lớn hơn và mất vài phút để mmap trên Docker Desktop.
      start_period: 5m

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8081}:8080"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nearby-postgres-data:
  nearby-redis-data:
  nearby-opensearch-data:
  nearby-neo4j-data:
