# Lớp phủ cho bản demo qua Cloudflare Tunnel.
#
#   bash scripts/tunnel_public.sh
#
# Khác với lớp phủ prod: KHÔNG có Caddy (Cloudflare lo TLS), không đổi image,
# không đụng cổng. Chỉ sửa đúng những biến phụ thuộc vào URL công khai.
services:
  frontend:
    environment:
      # Frontend nhúng giá trị này VÀO BUNDLE TRÌNH DUYỆT lúc `pnpm build`, và
      # Dockerfile build ngay khi container khởi động. Giá trị gốc trong
      # docker-compose.yml là http://localhost:8081 — đúng cho máy dev, nhưng
      # khách truy cập từ xa sẽ gọi về localhost CỦA HỌ và thấy trang trống.
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?PUBLIC_URL must be set}
      VITE_API_URL: ${PUBLIC_URL:?PUBLIC_URL must be set}

      # KHÔNG dùng MapTiler: khóa bị giới hạn theo origin, mà URL
      # trycloudflare.com là NGẪU NHIÊN mỗi lần chạy nên không đăng ký trước
      # được — style.json trả 403 và bản đồ TRẮNG TRƠN (maplibre không tự lùi
      # khi style lỗi, chỉ lùi khi biến rỗng). Khóa trong config/production.env
      # hiện cũng đã 403 khi gọi thẳng, kiểm chứng 14/09/2026.
      #
      # Cũng KHÔNG để rỗng nữa. Chuỗi rỗng đưa location-explorer.tsx về raster
      # OpenStreetMap, nhưng DNS ở đây trả 127.0.0.1/::1 cho
      # tile.openstreetmap.org (Cloudflare DoH trả đúng IP Fastly) nên mọi tile
      # chết ERR_CONNECTION_REFUSED và người dùng chỉ thấy lớp nền CSS giả
      # `.map-fallback` — trông như bản đồ vẽ xấu chứ không như bản đồ hỏng.
      #
      # CARTO Voyager: style VECTOR, không cần key, có nhãn đường/POI/khối nhà
      # nên gần Google Maps hơn hẳn raster. Đã kiểm chứng từ máy này:
      # style.json 200 (93 lớp), tiles.json 200, glyphs Noto Sans Regular 200 —
      # font đó là bắt buộc vì lớp `cluster-count` dùng text-field. Ghi công
      # CARTO + OpenStreetMap nằm sẵn trong tiles.json nên AttributionControl
      # tự hiện, không phải thêm tay.
      VITE_MAP_STYLE_URL: "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json"
      NEXT_PUBLIC_MAP_STYLE_URL: "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json"

  backend:
    environment:
      # Giữ cả localhost để vẫn mở được http://localhost:8081 trên máy này.
      ALLOWED_ORIGINS: "${PUBLIC_URL:?PUBLIC_URL must be set},http://localhost:8081,http://127.0.0.1:8081"
      # Chuỗi proxy thành client -> cloudflared -> nginx -> backend. cloudflared
      # đặt X-Forwarded-For = IP client, nginx nối thêm IP của cloudflared, nên
      # backend thấy [client, cloudflared] và phải bỏ 2 hop — giống hệt trường
      # hợp có Caddy. Để nguyên 1 (giá trị dev) thì mọi khách chia chung một
      # hạn mức vì đều quy về IP của cloudflared.
      TRUSTED_PROXY_HOPS: "2"
