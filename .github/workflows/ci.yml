name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Unit tests and coverage
        working-directory: backend
        run: pytest tests/unit --cov=app --cov-report=term-missing --cov-fail-under=20

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:58081
        run: pnpm build

  compose-and-system-tests:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Validate Compose configuration
        run: docker compose --env-file config/test.env config --quiet
      - name: Start complete stack and wait for health checks
        run: docker compose --env-file config/test.env up -d --build --wait
      # Không có bước này thì chỉ mục OpenSearch rỗng, truy xuất đa kênh luôn rơi
      # về PostGIS, và relevance gate bên dưới đo nhầm đường dự phòng.
      - name: Build search index, knowledge graph and feature store
        run: |
          docker compose --env-file config/test.env --profile data run --rm search-index
          docker compose --env-file config/test.env --profile data run --rm graph-sync
          docker compose --env-file config/test.env --profile data run --rm feature-store
      - name: API integration tests
        working-directory: backend
        env:
          RUN_INTEGRATION: "1"
          API_BASE_URL: http://localhost:58000
        run: pytest tests/integration
      - name: End-to-end event journey
        working-directory: backend
        env:
          RUN_E2E: "1"
          GATEWAY_BASE_URL: http://localhost:58081
        run: pytest tests/e2e
      - name: Relevance gate
        working-directory: backend
        env:
          API_BASE_URL: http://localhost:58000
          MIN_NDCG_AT_10: "0.75"
        run: python scripts/evaluate_relevance.py
      - name: Latency benchmark
        working-directory: backend
        env:
          API_BASE_URL: http://localhost:58000
          BENCHMARK_REQUESTS: "50"
          BENCHMARK_CONCURRENCY: "10"
          MAX_SEARCH_P95_MS: "1500"
          MAX_ERROR_RATE: "0.01"
        run: python scripts/benchmark_search.py
      # Số đo là bằng chứng cho chương Thực nghiệm nên phải giữ lại được, kể cả
      # khi một gate phía trên đã đỏ — đó chính là lúc cần xem số nhất.
      - name: Upload measurement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurements
          path: backend/results/
          if-no-files-found: ignore
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file config/test.env logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose --env-file config/test.env down -v
