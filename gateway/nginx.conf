worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent rid=$request_id rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=edge_rate:10m rate=10r/s;
    limit_req_status 429;

    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # DNS embedded của Docker. Dùng biến trong proxy_pass để nginx RE-RESOLVE
    # hostname theo chu kỳ, tránh cache IP cũ khi container backend/frontend bị
    # tạo lại (nếu không sẽ 502 sau mỗi lần rebuild).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        client_max_body_size 512k;

        location /api/ {
            limit_req zone=edge_rate burst=20 nodelay;

            proxy_set_header X-Request-ID $request_id_final;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            set $backend_target backend:8000;
            proxy_pass http://$backend_target;
        }

        location /health {
            limit_req zone=edge_rate burst=20 nodelay;
            proxy_set_header X-Request-ID $request_id_final;
            set $backend_health backend:8000;
            proxy_pass http://$backend_health;
        }

        location / {
            proxy_set_header X-Request-ID $request_id_final;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            set $frontend_target frontend:3000;
            proxy_pass http://$frontend_target;
        }
    }
}
